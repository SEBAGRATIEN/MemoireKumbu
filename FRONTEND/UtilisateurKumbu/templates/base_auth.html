{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kumbu{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/logo.jpeg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
  {% block extra_css %}{% endblock %}
  <script>
    /* Applique le thème avant l'affichage pour éviter le clignotement */
    (function () {
      try {
        var t = localStorage.getItem("kumbu-theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

{% block content %}{% endblock %}

<script src="{% static 'js/script.js' %}?v=6"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
