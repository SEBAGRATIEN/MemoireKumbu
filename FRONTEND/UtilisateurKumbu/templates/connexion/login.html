{% extends "base_auth.html" %}
{% block title %}Connexion | kumbu{% endblock %}

{% block content %}
 <section id="page-connexion" class="page">
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center; margin-bottom:22px;">
          <div class="logo" style="justify-content:center">Kum<span>bu</span></div>
        </div>

        <div class="auth-tabs">
          <div class="auth-tab active" data-form="connexion">Se connecter</div>
          <div class="auth-tab" data-form="inscription">Créer un compte</div>
        </div>

        <!-- Formulaire : Se connecter -->
        <form class="auth-form active" id="form-connexion">
          <div class="field"><label for="lc-nom">Nom</label><input id="lc-nom" type="text" placeholder="Votre nom"></div>
          <div class="field"><label for="lc-mdp">Mot de passe</label><input id="lc-mdp" type="password" placeholder="••••••••"></div>
          <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>

        <!-- Formulaire : Créer un compte -->
        <form class="auth-form" id="form-inscription">
          <div class="two-fields">
            <div class="field"><label for="li-nom">Nom</label><input id="li-nom" type="text" placeholder="Nom"></div>
            <div class="field"><label for="li-postnom">Post-nom</label><input id="li-postnom" type="text" placeholder="Post-nom"></div>
          </div>
          <div class="field"><label for="li-prenom">Prénom</label><input id="li-prenom" type="text" placeholder="Prénom"></div>
          <div class="field"><label for="li-mdp1">Mot de passe</label><input id="li-mdp1" type="password" placeholder="••••••••"></div>
          <div class="field"><label for="li-mdp2">Confirmer le mot de passe</label><input id="li-mdp2" type="password" placeholder="••••••••"></div>
          <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
        </form>

        <div class="auth-divider">ou</div>

        <button type="button" id="google-login" class="student-link">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"/>
            <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.46-2.35l-3.14-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.04H3.27v2.53A9.75 9.75 0 0 0 12 21.5Z"/>
            <path fill="#FBBC05" d="M6.51 13.58A5.86 5.86 0 0 1 6.2 12c0-.55.1-1.09.31-1.58V7.89H3.27A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.02 4.11l3.24-2.53Z"/>
            <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.39 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.73 5.39l3.24 2.53C7.29 8.1 9.45 6.38 12 6.38Z"/>
          </svg>
          Continuer avec Google
        </button>

        <p id="google-error" style="display:none; margin-top:12px; text-align:center; color:#c0392b; font-size:13px;"></p>
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_js %}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA14B1oKjqJHyBmaR8PP5LgHy6mWJyIgtQ",
  authDomain: "kumbu-67e5a.firebaseapp.com",
  projectId: "kumbu-67e5a",
  storageBucket: "kumbu-67e5a.firebasestorage.app",
  messagingSenderId: "424041539643",
  appId: "1:424041539643:web:8e3ae3fd06551d8e28d41e"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.kumbuFirebase = {
    auth,
    provider,
    signInWithPopup
  };
</script>

{% endblock %}
